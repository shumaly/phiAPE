[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phiape-benchmarks"
version = "1.0.0"
description = "Reproducible phiAPE TST benchmarks on the UEA and UCR archives"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
  "aeon>=1.0,<2",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "sktime>=0.30,<1",
  "torch>=1.13",
  "xlsxwriter>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
phiape-benchmarks = "phiape_benchmarks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
